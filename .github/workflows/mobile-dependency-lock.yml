name: Sync Expo mobile dependency lockfile
on:
  push:
    branches:
      - feature/hybrid-render-local-ai
    paths:
      - apps/mobile/package.json
      - .github/workflows/mobile-dependency-lock.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hybrid-render-local-ai
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Update package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Typecheck mobile
        run: npm run typecheck -w @goodside/mobile
      - name: Commit dependency lock
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Sync Expo Lucide dependency lockfile"
            git push origin HEAD:feature/hybrid-render-local-ai
          fi
