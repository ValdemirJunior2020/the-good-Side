# The Good Side API only. AIHOT and Ollama remain on the user's Windows computer.
# Deploy as a separate Render Blueprint after checking the service name and chosen workspace.
# Free is suitable for verification, not reliable 24/7 push scheduling (it can sleep).
services:
  - type: web
    name: the-good-side-api
    runtime: node
    repo: https://github.com/ValdemirJunior2020/the-good-Side.git
    branch: feature/hybrid-render-local-ai
    region: virginia
    plan: free
    autoDeployTrigger: checksPass
    buildCommand: npm ci --include=dev --no-audit --no-fund
    startCommand: npm run start -w @goodside/api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ENABLE_PUSH_SCHEDULER
        value: "false"
      - key: GOOGLE_CLIENT_IDS
        sync: false
      - key: ADMIN_GOOGLE_EMAILS
        sync: false
      - key: APPS_SCRIPT_URL
        sync: false
      - key: APPS_SCRIPT_SHARED_SECRET
        sync: false
      - key: RESEARCH_WORKER_KEY
        sync: false
      - key: PUSH_TOKEN_ENCRYPTION_KEY_BASE64
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
