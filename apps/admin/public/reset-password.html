<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Reset password · The Good Side</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(140deg,#ffe8c4,#f9d4cd 48%,#ecd4ed);font:16px system-ui,sans-serif;color:#281e29}main{width:min(420px,88vw);padding:30px;border:2px solid #fff;border-radius:30px;background:#ffffffa6;box-shadow:0 15px 60px #a46e7444}h1{font-size:30px;margin:0 0 12px}p{line-height:1.55;color:#5e4956}label{display:block;font-weight:700;margin:22px 0 6px}input{box-sizing:border-box;width:100%;border:1px solid #e8bdac;border-radius:15px;padding:15px;font-size:17px;background:#fff}button{width:100%;margin:17px 0 0;padding:15px;border:0;border-radius:16px;background:#bd743c;color:white;font-size:16px;font-weight:800;cursor:pointer}button:disabled{opacity:.5}#status{min-height:20px;font-weight:600}a{color:#783f33}</style>
</head><body><main><div aria-hidden="true" style="font-size:38px">☀️</div><h1>New password</h1><p>Choose a new password for your Good Side email account. Google accounts keep using Google sign-in.</p>
<form id="reset"><label for="password">New password</label><input id="password" type="password" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters"/><label for="confirm">Confirm password</label><input id="confirm" type="password" autocomplete="new-password" minlength="8" required placeholder="Repeat your password"/><button id="save" type="submit">Reset password</button></form>
<p id="status" role="status"></p><p><a href="https://the-good-side-command-center.netlify.app/">The Good Side</a></p></main>
<script>
(function(){
const base="https://tqdqekxvisgmotibjiwb.supabase.co",key="sb_publishable_FcW-IRdeyyBEmwxSAZZCXA_1T0qJIzo";
const params=new URLSearchParams(location.hash.slice(1));const query=new URLSearchParams(location.search);
const token=params.get("access_token");const kind=params.get("type");const err=params.get("error_description")||query.get("error_description");
const status=document.getElementById("status"),form=document.getElementById("reset"),btn=document.getElementById("save");
if(token&&["signup","email"].includes(kind)){form.style.display="none";history.replaceState(null,"",location.pathname);status.textContent="Your email is confirmed! Return to The Good Side app and log in with your email and password.";return}
if(!token||kind!=="recovery"){form.style.display="none";status.textContent=err||"This reset link is invalid or expired. Request another link from the app.";return}
history.replaceState(null,"",location.pathname);
form.addEventListener("submit",async function(ev){
ev.preventDefault();const password=document.getElementById("password").value;
if(password!==document.getElementById("confirm").value){status.textContent="Passwords do not match.";return}
btn.disabled=true;status.textContent="Updating password…";
try{
const r=await fetch(base+"/auth/v1/user",{method:"PUT",headers:{"Content-Type":"application/json",apikey:key,Authorization:"Bearer "+token},body:JSON.stringify({password})});
const result=await r.json();if(!r.ok)throw Error(result.msg||result.message||result.error_description||"Update failed");
form.style.display="none";status.textContent="Password updated. Return to The Good Side app and log in using your email and new password.";
}catch(e){status.textContent=String(e.message||e);btn.disabled=false}
});
})();
</script></body></html>
